name: CI

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "JDK ${{ matrix.java }} on ${{ matrix.os }} [${{ matrix.expander_leg }}]"
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 21
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-21-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: 'Check out repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 'Cache local Maven repository'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: 'Set up JDK ${{ matrix.java }}'
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
          # No vendor publishes a native JDK 8 for Windows on ARM64. Windows 11 ARM
          # runs x64 binaries under emulation, so use the x64 JDK 8 build there.
          # An empty value keeps the default, which is the runner's own architecture.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || '' }}
    - name: 'Install'
      shell: bash
      run: mvn -B install -U -DskipTests=true
    - name: 'Test'
      shell: bash
      run: mvn -B verify -U -Dmaven.javadoc.skip=true

    timeout-minutes: 150
